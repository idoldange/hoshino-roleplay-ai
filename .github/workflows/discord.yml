name: Discord Commit Notification

on: [push]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const msg = context.payload.head_commit.message || '';
            const lines = msg.split('\n');
            const title = (lines[0] || '').trim() || '(no message)';
            const body = lines.slice(1).join('\n').trim();
            const cleanTitle = title.length > 256 ? title.substring(0, 253) + '...' : title;
            const cleanBody = body.length > 1800 ? body.substring(0, 1800) + '...' : body;
            
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const commitUrl = `${repoUrl}/commit/${context.sha}`;
            const actorUrl = `https://github.com/${context.actor}`;
            
            const meta = `**Author:** [${context.actor}](${actorUrl})\n**Commit:** [${context.sha.substring(0, 7)}](${commitUrl})`;
            
            const payload = {
              username: "Hoshino Update",
              embeds: [{
                title: cleanTitle,
                url: commitUrl,
                description: cleanBody ? `${cleanBody}\n\n${meta}` : meta,
                color: 5814783,
                footer: {
                  text: `${context.repo.owner}/${context.repo.repo}`
                }
              }]
            };

            const https = require('https');
            const url = new URL(process.env.DISCORD_WEBHOOK_URL);
            
            const options = {
              hostname: url.hostname,
              path: url.pathname + url.search,
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              }
            };

            await new Promise((resolve, reject) => {
              const req = https.request(options, (res) => {
                res.on('error', (e) => {
                  clearTimeout(timeout);
                  reject(e);
                });
                res.on('end', () => {
                  clearTimeout(timeout);
                  if (res.statusCode >= 200 && res.statusCode < 300) {
                    resolve();
                  } else {
                    reject(new Error(`Discord Webhook failed with status ${res.statusCode}`));
                  }
                });
                res.resume();
              });
              const timeout = setTimeout(() => {
                req.destroy(new Error('Discord webhook request timed out after 15 seconds'));
              }, 15000);
              req.on('error', (e) => {
                clearTimeout(timeout);
                reject(e);
              });
              req.write(JSON.stringify(payload));
              req.end();
            });
